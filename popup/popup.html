<!--
  FILE: popup/popup.html
  v1.4 — Material 3–inspired tonal redesign. Replaces the glass/translucent
  v1.3 visual system with opaque tonal surfaces and a fixed elevation scale.
  No IDs, classes referenced by popup.js, or message contracts were changed.
  popup.js is untouched by this pass (verified below).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SeenDisJob</title>
<style>
  /* ============================================================
     TOKENS — opaque tonal palette. Neutral gray/black/white base,
     three restrained semantic accents (success / warning / error).
     Every surface below is a solid color; no alpha compositing is
     used for backgrounds, only for the two hairline drop-shadows.
     ============================================================ */
  :root {
    /* Surfaces (lowest → highest emphasis) */
    --page-bg:               #EAEAE6;
    --surface:                #FFFFFF;
    --surface-container:      #F2F2EE;
    --surface-container-high: #E7E7E1;
    --surface-container-highest: #DCDCD5;
    --surface-raised:         #FFFFFF; /* paired with --elevation-1 shadow */

    /* Outlines */
    --outline:        #D8D7D0;
    --outline-strong:  #8F8F87;

    /* Ink */
    --ink-primary:    #191916;
    --ink-secondary:  #54544E;
    --ink-tertiary:   #74746D;
    --on-inverse:     #FFFFFF;

    /* Semantic — success */
    --success:            #1E7A34;
    --success-container:  #DCEFDD;
    --on-success-container: #123D1D;
    --success-outline:    #A9D3AE;

    /* Semantic — warning */
    --warning:            #7A4B00;
    --warning-container:  #F3E2C0;
    --on-warning-container: #4A2E00;
    --warning-outline:    #DDBD7E;

    /* Semantic — error */
    --error:            #A5231B;
    --error-container:  #F6D9D6;
    --on-error-container: #5C140E;
    --error-outline:    #E3AFA9;

    /* Elevation — flat, neutral drop-shadows only (no glow, no color) */
    --elevation-1: 0 1px 2px rgba(0,0,0,.07), 0 1px 1px rgba(0,0,0,.05);

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  body {
    margin: 0;
    width: 320px;
    background: var(--page-bg);
    color: var(--ink-primary);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.45;
  }

  a { color: inherit; }

  /* ============================================================
     1. BRAND + STATUS
     ============================================================ */
  header {
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--outline);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header img { width: 24px; height: 24px; flex-shrink: 0; border-radius: 5px; }
  header h1 {
    font-size: 13.5px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink-primary);
  }
  header .sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin-top: 2px;
  }

  .update-banner,
  .consent-banner {
    margin: 10px 16px 0;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
  }
  .update-banner {
    background: var(--success-container);
    color: var(--on-success-container);
    border: 1px solid var(--success-outline);
  }
  .update-banner a {
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .update-banner a:focus-visible { outline: 2px solid var(--on-success-container); outline-offset: 2px; border-radius: 2px; }

  .consent-banner {
    background: var(--warning-container);
    color: var(--on-warning-container);
    border: 1px solid var(--warning-outline);
  }
  .consent-banner a {
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .consent-banner a:focus-visible { outline: 2px solid var(--on-warning-container); outline-offset: 2px; border-radius: 2px; }

  /* ============================================================
     2. CURRENT-TAB RESULT
     ============================================================ */
  .status-card {
    margin: 14px 16px 0;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--surface-raised);
    border: 1px solid var(--outline);
    box-shadow: var(--elevation-1);
  }
  .status-card.ok {
    background: var(--success-container);
    border-color: var(--success-outline);
  }
  .status-card.alert {
    background: var(--error-container);
    border-color: var(--error-outline);
  }

  .status-row { display: flex; align-items: flex-start; gap: 10px; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ink-tertiary);
    margin-top: 4px; flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--surface-raised);
  }
  .status-card.ok .status-dot    { background: var(--success); box-shadow: 0 0 0 2px var(--success-container); }
  .status-card.alert .status-dot { background: var(--error);   box-shadow: 0 0 0 2px var(--error-container); }

  .status-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; color: var(--ink-primary); }
  .status-card.ok .status-title    { color: var(--on-success-container); }
  .status-card.alert .status-title { color: var(--on-error-container); }

  .status-detail { color: var(--ink-secondary); font-size: 12.5px; }
  .status-card.ok .status-detail    { color: var(--on-success-container); }
  .status-card.alert .status-detail { color: var(--on-error-container); }
  .status-detail b { font-weight: 700; color: inherit; }

  /* ============================================================
     3. TRACKED-JOB COUNT
     ============================================================ */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 12px 16px 0;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-container);
  }
  .stat-row .count {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-primary);
  }
  .stat-row .label {
    color: var(--ink-tertiary);
    font-size: 11px;
    text-align: right;
    max-width: 190px;
  }

  .muted-note {
    margin: 6px 16px 0;
    font-size: 11px;
    color: var(--ink-tertiary);
    text-align: right;
  }
  .empty-state {
    margin: 10px 16px 0;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    font-size: 12px;
    color: var(--ink-secondary);
    text-align: center;
  }

  /* ============================================================
     4. RECENT ACTIVITY
     ============================================================ */
  .history-panel { margin: 14px 16px 0; }
  .history-heading {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-tertiary);
    margin-bottom: 6px;
  }
  #history-list {
    max-height: 168px;
    overflow-y: auto;
    border: 1px solid var(--outline);
    border-radius: 8px;
    background: var(--surface);
  }
  .hist-item {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--outline);
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-dot {
    width: 7px; height: 7px; border-radius: 50%;
    margin-top: 5px; flex-shrink: 0;
    background: var(--ink-tertiary);
  }
  .hist-dot.ok    { background: var(--success); }
  .hist-dot.alert { background: var(--error); }
  .hist-dot.muted { background: var(--ink-tertiary); }
  .hist-body { min-width: 0; flex: 1; }
  .hist-label {
    font-size: 12px; font-weight: 600; color: var(--ink-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-detail {
    font-size: 11.5px; color: var(--ink-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-detail em { font-style: normal; font-weight: 600; color: var(--ink-primary); }
  .hist-time { font-size: 10.5px; color: var(--ink-tertiary); margin-top: 1px; }

  /* ============================================================
     5. MAIN ACTIONS — filled / tonal / outlined button variants
     ============================================================ */
  .actions {
    margin-top: 14px;
    padding: 14px 16px;
    border-top: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 13px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    text-align: left;
    width: 100%;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease, transform .06s ease;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: 2px solid var(--ink-primary);
    outline-offset: 2px;
  }

  /* Filled — primary action */
  #btn-dashboard {
    background: var(--ink-primary);
    color: var(--on-inverse);
    border-color: var(--ink-primary);
  }
  #btn-dashboard:hover  { background: #000000; border-color: #000000; }
  #btn-dashboard:active { background: #000000; }

  /* Tonal — secondary action */
  #btn-backup {
    background: var(--surface-container-high);
    color: var(--ink-primary);
    border-color: var(--surface-container-high);
  }
  #btn-backup:hover  { background: var(--surface-container-highest); border-color: var(--surface-container-highest); }
  #btn-backup:active { background: #D2D2CB; border-color: #D2D2CB; }

  /* Outlined destructive — de-emphasized until interacted with */
  button.danger {
    background: var(--surface);
    color: var(--error);
    border-color: var(--error-outline);
  }
  button.danger:hover {
    background: var(--error-container);
    color: var(--on-error-container);
    border-color: var(--error);
  }
  button.danger:active {
    background: var(--error);
    color: var(--on-inverse);
    border-color: var(--error);
  }

  #action-feedback {
    padding: 0 16px 14px;
    font-size: 11.5px;
    color: var(--ink-secondary);
    min-height: 14px;
  }
</style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <div>
      <h1>SeenDisJob</h1>
      <div class="sub" id="header-sub">Checking status…</div>
    </div>
  </header>

  <div id="update-banner" class="update-banner" style="display:none;"></div>

  <div id="consent-banner" class="consent-banner" style="display:none;"></div>

  <div id="status-card" class="status-card">
    <div class="status-row">
      <div class="status-dot"></div>
      <div>
        <div class="status-title" id="status-title">Checking this tab…</div>
        <div class="status-detail" id="status-detail"></div>
      </div>
    </div>
  </div>

  <div class="stat-row">
    <div class="count" id="record-count">–</div>
    <div class="label">job postings tracked<br>(last 60 days)</div>
  </div>
  <div id="muted-note" class="muted-note" style="display:none;"></div>

  <div id="empty-state" class="empty-state" style="display:none;">
    No job postings tracked yet — browse to a job page to get started.
  </div>

  <div id="history-panel" class="history-panel" style="display:none;">
    <div class="history-heading">Recent activity</div>
    <div id="history-list"></div>
  </div>

  <div class="actions">
    <button id="btn-dashboard" type="button">Open dashboard</button>
    <button id="btn-backup" type="button">Copy tracked-job backup to clipboard</button>
    <button id="btn-clear" type="button" class="danger">Clear all tracked job data</button>
  </div>
  <div id="action-feedback" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
